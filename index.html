<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu RPG - Criação</title>
    <style>
        body { background-color: #1a1a1a; color: #f2f2f2; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #2a2a2a; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 400px; border-top: 5px solid #8a2be2; }
        h2 { text-align: center; color: #8a2be2; margin-top: 0; }
        label { font-size: 14px; font-weight: bold; margin-top: 10px; display: block; color: #bbb; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; background-color: #333; color: white; border: 1px solid #444; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #8a2be2; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #6a1b9a; }
        #resultado { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; text-align: center; font-size: 14px; }
        .erro { background-color: #c62828; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Criar Feiticeiro</h2>

    <label>Nome do Feiticeiro</label>
    <input type="text" id="nome" placeholder="Ex: Yuji Itadori">

    <label>Grau</label>
    <select id="grau">
        <option value="Grau 4">Grau 4</option>
        <option value="Grau 3">Grau 3</option>
        <option value="Grau 2">Grau 2</option>
        <option value="Grau 1">Grau 1</option>
        <option value="Grau Especial">Grau Especial</option>
    </select>

    <label>Técnica Amaldiçoada</label>
    <input type="text" id="tecnica" placeholder="Ex: Santuário Malevolente">

    <label>Vigor (1-10)</label>
    <input type="number" id="vigor" min="1" max="10" value="1">

    <label>Energia Base (1-10)</label>
    <input type="number" id="energia" min="1" max="10" value="1">

    <label>Força (1-10)</label>
    <input type="number" id="forca" min="1" max="10" value="1">

    <label>Agilidade (1-10)</label>
    <input type="number" id="agilidade" min="1" max="10" value="1">

    <label>Resistência (1-10)</label>
    <input type="number" id="resistencia" min="1" max="10" value="1">

    <button onclick="criarFeiticeiro()">Registar Personagem</button>

    <div id="resultado"></div>
</div>

<script>
    async function criarFeiticeiro() {
        const dados = {
            nome: document.getElementById('nome').value,
            grau: document.getElementById('grau').value,
            tecnicaAmaldicoada: document.getElementById('tecnica').value,
            forca: parseInt(document.getElementById('forca').value),
            agilidade: parseInt(document.getElementById('agilidade').value),
            resistencia: parseInt(document.getElementById('resistencia').value),
            vigor: parseInt(document.getElementById('vigor').value),
            energiaAtributo: parseInt(document.getElementById('energia').value),
            jogador: {
                id: 1
            }
        };

        const divResultado = document.getElementById('resultado');

        try {
            const resposta = await fetch('http://localhost:8080/feiticeiros', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (resposta.ok) {
                const feiticeiroCriado = await resposta.json();
                window.location.href = `ficha.html?id=${feiticeiroCriado.id}`;
            } else {
                divResultado.className = "erro";
                divResultado.innerText = "Erro ao criar.";
                divResultado.style.display = "block";
            }
        } catch (erro) {
            divResultado.className = "erro";
            divResultado.innerText = "Falha de ligação ao servidor.";
            divResultado.style.display = "block";
        }
    }
</script>

</body>
</html>
